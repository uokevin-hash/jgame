<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>JGame - 레트로 게임 웹사이트</title>
  <meta name="description" content="웹에서 즐기는 재미있는 레트로 게임 컬렉션 JGame!" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jgame-gamma.vercel.app/" />
  <meta property="og:title" content="JGame - 게임 시작하기" />
  <meta property="og:description" content="지금 바로 웹에서 다양한 미니게임을 즐겨보세요!" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="JGame - 레트로 게임 웹사이트" />
  <meta name="twitter:description" content="지금 바로 웹에서 다양한 미니게임을 즐겨보세요!" />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* 1. 배경 애니메이션 효과 */
      background: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #0ea5e9);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 2. 카드 등장 애니메이션 및 3D 설정 */
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
      backdrop-filter: blur(12px);
      
      /* 애니메이션 및 3D 효과를 위한 속성 */
      animation: fadeInUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      transform-style: preserve-3d;
      opacity: 0;
      transform: translateY(40px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 이미지 호버 시 튀어나오는 효과 */
    .thumbnail {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #475569;
      margin-bottom: 20px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      /* 3D 깊이감 부여 */
      transform: translateZ(30px);
    }

    .card:hover .thumbnail {
      transform: translateZ(50px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      transform: translateZ(40px);
    }

    p {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
      transform: translateZ(20px);
    }

    /* 3. 버튼 펄스(네온) 효과 */
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 35px;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      animation: pulseNeon 2s infinite;
      transform: translateZ(30px);
      position: relative;
      overflow: hidden;
    }

    @keyframes pulseNeon {
      0% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
      50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 0 40px rgba(2, 132, 199, 0.6); }
      100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
    }

    .btn:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateZ(40px) scale(1.05);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card" id="interactiveCard">
    <img 
      src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop" 
      alt="JGame 대표 이미지" 
      class="thumbnail" 
    />
    <h1>JGame</h1>
    <p>레트로 감성의 미니게임 세상에 오신 것을 환영합니다!<br />아래 버튼을 눌러 게임을 시작해보세요.</p>
    <a href="#" class="btn">게임 시작하기</a>
  </div>

  <!-- 4. 마우스 움직임에 따른 3D 틸트 자바스크립트 -->
  <script>
    const card = document.getElementById('interactiveCard');

    // 마우스가 카드 위에서 움직일 때
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left; // 카드 내 마우스 X 좌표
      const y = e.clientY - rect.top;  // 카드 내 마우스 Y 좌표
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      // 중심점을 기준으로 회전 각도 계산 (최대 10도)
      const rotateX = ((y - centerY) / centerY) * -10; 
      const rotateY = ((x - centerX) / centerX) * 10;

      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    // 마우스가 카드에 들어올 때 (부드러운 전환 효과 제거하여 즉각 반응하도록)
    card.addEventListener('mouseenter', () => {
      card.style.transition = `transform 0.1s ease`;
    });

    // 마우스가 카드를 벗어날 때 (원래 상태로 복귀)
    card.addEventListener('mouseleave', () => {
      card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
      card.style.transition = `transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)`;
    });
  </script>

</body>
</html>
